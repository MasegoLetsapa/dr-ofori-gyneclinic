<svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
    [attr.stroke-width]="strokeWidth()" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true">

    @switch (name()) {

    <!-- HEART -->
    @case ('heart') {
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06

    <!-- BABY -->
    @case ('baby') {
    <circle cx="12" cy="12" r="8" />

    <path d="M9 10h.01" />
    <path d="M15 10h.01" />

    <path d="M9 15c1.5 1.2 4.5 1.2 6 0" />

    <path d="M8 4.5C8.8 3.5 10.2 3 12 3s3.2.5 4 1.5" />
    }


    <!-- CALENDAR -->
    @case ('calendar') {
    <rect x="3" y="4" width="18" height="17" rx="2" />

    <path d="M16 2v4" />
    <path d="M8 2v4" />
    <path d="M3 10h18" />

    <path d="M8 14h.01" />
    <path d="M12 14h.01" />
    <path d="M16 14h.01" />
    <path d="M8 18h.01" />
    <path d="M12 18h.01" />
    }


    <!-- SCREENING -->
    @case ('screening') {
    <circle cx="11" cy="11" r="7" />
    <path d="m20 20-4-4" />
    <path d="M8.5 11h5" />
    <path d="M11 8.5v5" />
    }


    <!-- ULTRASOUND -->
    @case ('ultrasound') {
    <path d="M4 5h16v14H4z" />
    <path d="M7 9c1.5-2 4-2 5.5 0s4 2 5.5 0" />
    <path d="M7 13c1.5-2 4-2 5.5 0s4 2 5.5 0" />
    <path d="M9 19v2" />
    <path d="M15 19v2" />
    }


    <!-- FERTILITY -->
    @case ('fertility') {
    <circle cx="12" cy="12" r="3" />
    <circle cx="12" cy="4" r="1.5" />
    <circle cx="19" cy="8" r="1.5" />
    <circle cx="19" cy="16" r="1.5" />
    <circle cx="12" cy="20" r="1.5" />
    <circle cx="5" cy="16" r="1.5" />
    <circle cx="5" cy="8" r="1.5" />
    }


    <!-- WELLNESS -->
    @case ('wellness') {
    <path d="M12 21s8-4.35 8-11a4.5 4.5 0 0 0-8-2.7A4.5 4.5 0 0 0 4 10c0 6.65 8 11 8 11Z" />
    <path d="M12 7v7" />
    <path d="M8.5 10.5h7" />
    }


    <!-- SHIELD -->
    @case ('shield') {
    <path d="M12 3 20 6v5c0 5.2-3.4 8.8-8 10
           -4.6-1.2-8-4.8-8-10V6l8-3Z" />
    <path d="m8.5 12 2.3 2.3 4.7-5" />
    }


    <!-- SPARK -->
    @case ('spark') {
    <path d="m12 3 1.4 5.6L19 10l-5.6 1.4L12 17l-1.4-5.6L5 10l5.6-1.4L12 3Z" />
    <path d="m19 16 .6 2.4L22 19l-2.4.6L19 22l-.6-2.4L16 19l2.4-.6L19 16Z" />
    }


    <!-- ARROW RIGHT -->
    @case ('arrow-right') {
    <path d="M5 12h14" />
    <path d="m13 6 6 6-6 6" />
    }


    <!-- PHONE -->
    @case ('phone') {
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2
           19.79 19.79 0 0 1-8.63-3.07
           19.5 19.5 0 0 1-6-6
           19.79 19.79 0 0 1-3.07-8.67
           A2 2 0 0 1 4.11 2h3
           a2 2 0 0 1 2 1.72
           12.84 12.84 0 0 0 .7 2.81
           2 2 0 0 1-.45 2.11L8.09 9.91

           a2 2 0 0 1 2.11-.45
           12.84 12.84 0 0 0 2.81.7
           A2 2 0 0 1 22 16.92Z" />
    }


    <!-- MAIL -->
    @case ('mail') {
    <rect x="3" y="5" width="18" height="14" rx="2" />
    <path d="m3 7 9 6 9-6" />
    }


    <!-- LOCATION -->
    @case ('location') {
    <path d="M20 10c0 5-8 11-8 11S4 15 4 10
           a8 8 0 1 1 16 0Z" />
    <circle cx="12" cy="10" r="2.5" />
    }


    <!-- CHECK -->
    @case ('check') {
    <path d="m5 12 4 4L19 6" />
    }


    <!-- MENU -->
    @case ('menu') {
    <path d="M4 6h16" />
    <path d="M4 12h16" />
    <path d="M4 18h16" />
    }


    <!-- CLOSE -->
    @case ('close') {
    <path d="m6 6 12 12" />
    <path d="m18 6-12 12" />
    }


    <!-- INSTAGRAM -->
    @case ('instagram') {
    <rect x="3" y="3" width="18" height="18" rx="5" />
    <circle cx="12" cy="12" r="4" />
    <path d="M17.5 6.5h.01" />
    }


    <!-- FACEBOOK -->
    @case ('facebook') {
    <path d="M14 8h3V4h-3c-3.3 0-5 2-5 5v3H6v4h3v4h4v-4h3l1-4h-4V9c0-.7.3-1 1-1Z" />
    }


    <!-- WHATSAPP -->
    @case ('whatsapp') {
    <path d="M20.5 3.5A11 11 0 0 0 3.4 17.2L2 22l4.9-1.3
           A11 11 0 1 0 20.5 3.5Z" />

    <path d="M8.5 8.5c.3-.6.6-.6 1-.6h.6
           c.2 0 .4.1.5.4l.8 1.8
           c.1.3.1.5-.1.7l-.7.8
           c.8 1.5 2 2.6 3.5 3.4l.8-.7
           c.2-.2.4-.2.7-.1l1.8.8
           c.3.1.4.3.4.5.5
           0 .4-.1.8-.4 1.1
           -.4.5-1.2.8-1.8.7
           -1.7-.3-3.5-1.3-5-2.7
           -1.3-1.3-2.4-3-2.7-4.7
