<header class="fixed inset-x-0 top-0 z-50
         border-b border-white/[0.06]
         bg-[#070711]/80
         backdrop-blur-xl">
    <div class="mx-auto flex h-20 max-w-7xl
           items-center justify-between
           px-5 sm:px-8">

        <!-- =========================
         LOGO
    ========================== -->

        <a href="#home" (click)="closeMobileMenu()" class="group flex items-center gap-3">

            <div class="flex h-10 w-10 items-center justify-center
               rounded-xl
               border border-pink-400/25
               bg-gradient-to-br
               from-pink-500/15
               to-violet-500/15
               transition duration-300
               group-hover:border-pink-400/50">
                <span class="font-serif text-lg text-pink-400">
                    D
                </span>
            </div>

            <div>

                <div class="font-serif text-base leading-none
                 text-white">
                    Dr. Ofori
                </div>

                <div class="mt-1 text-[7px]
                 font-bold
                 tracking-[0.3em]
                 text-pink-400">
                    GYNE CLINIC
                </div>

            </div>

        </a>


        <!-- =========================
         DESKTOP NAV
    ========================== -->

        <nav class="hidden items-center gap-8
             lg:flex">

            <a href="#home" class="text-xs text-zinc-300
               transition hover:text-white">
                Home
            </a>

            <a href="#services" class="text-xs text-zinc-500
               transition hover:text-white">
                Services
            </a>

            <a href="#about" class="text-xs text-zinc-500
               transition hover:text-white">
                About
            </a>

            <a href="#doctor" class="text-xs text-zinc-500
               transition hover:text-white">
                Dr. Ofori
            </a>

            <a href="#resources" class="text-xs text-zinc-500
               transition hover:text-white">
                Resources
            </a>

            <a href="#contact" class="text-xs text-zinc-500
               transition hover:text-white">
                Contact
            </a>

        </nav>


        <!-- =========================
         DESKTOP CTA
    ========================== -->

        <a href="#appointment" class="hidden items-center gap-2
             rounded-full
             bg-gradient-to-r
             from-pink-500 to-violet-500
             px-5 py-3
             text-xs font-bold
             text-white
             shadow-[0_8px_30px_rgba(255,61,145,0.16)]
             transition duration-300
             hover:-translate-y-0.5
             hover:shadow-[0_12px_40px_rgba(255,61,145,0.28)]
             lg:inline-flex">
            Book Appointment

            <app-icon name="arrow-right" [size]="14" />
        </a>


        <!-- =========================
         MOBILE MENU BUTTON
    ========================== -->

        <button type="button" (click)="toggleMobileMenu()" [attr.aria-expanded]="mobileMenuOpen()"
            aria-label="Toggle navigation" class="flex h-10 w-10
             items-center justify-center
             rounded-xl
             border border-white/10
             bg-white/[0.025]
             text-zinc-300
             transition
             hover:border-pink-400/30
             hover:text-white
             lg:hidden">

            @if (mobileMenuOpen()) {

            <app-icon name="close" [size]="20" />

            } @else {

            <app-icon name="menu" [size]="20" />

            }

        </button>

    </div>


    <!-- =========================
       MOBILE MENU
  ========================== -->

    @if (mobileMenuOpen()) {

    <div class="border-t border-white/[0.06]
             bg-[#070711]/95
             px-5 py-6
             backdrop-blur-2xl
             lg:hidden">

        <nav class="mx-auto max-w-7xl">

            <div class="flex flex-col">

                <a href="#home" (click)="closeMobileMenu()" class="border-b border-white/[0.05]
                   py-4 text-sm text-zinc-300
                   transition hover:text-pink-400">
                    Home
                </a>

                <a href="#services" (click)="closeMobileMenu()" class="border-b border-white/[0.05]
                   py-4 text-sm text-zinc-300
                   transition hover:text-pink-400">
                    Services
                </a>

                <a href="#about" (click)="closeMobileMenu()" class="border-b border-white/[0.05]
                   py-4 text-sm text-zinc-300
                   transition hover:text-pink-400">
                    About
                </a>

                <a href="#doctor" (click)="closeMobileMenu()" class="border-b border-white/[0.05]
                   py-4 text-sm text-zinc-300
                   transition hover:text-pink-400">
                    Dr. Ofori
                </a>

                <a href="#resources" (click)="closeMobileMenu()" class="border-b border-white/[0.05]
                   py-4 text-sm text-zinc-300
                   transition hover:text-pink-400">
                    Resources
                </a>

                <a href="#contact" (click)="closeMobileMenu()" class="py-4 text-sm text-zinc-300
                   transition hover:text-pink-400">
                    Contact
                </a>

            </div>


            <!-- Mobile CTA -->

            <a href="#appointment" (click)="closeMobileMenu()" class="mt-6 flex w-full
                 items-center justify-center
                 gap-3 rounded-xl
                 bg-gradient-to-r
                 from-pink-500 to-violet-500
                 px-5 py-4
                 text-sm font-bold
                 text-white
                 shadow-[0_10px_35px_rgba(255,61,145,0.18)]">
                Book an Appointment

                <app-icon name="arrow-right" [size]="16" />
            </a>

        </nav>

    </div>

    }

</header>
